name: Frontend CI/CD Pipeline

on:
  push:
    branches: 
      - main
      - master
      - develop
      - calneder
      - calender
      - merge
      - merge_new
      - new
      - production
      - roles
      - working
  pull_request:
    branches: 
      - main
      - master
      - develop
      - calneder
      - calender
      - merge
      - merge_new
      - new
      - production
      - roles
      - working
  workflow_dispatch: # Allows manual triggering from Actions tab

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true # Don't fail build if linting fails

      - name: Run tests
        env:
          NODE_ENV: test
          NEXT_PUBLIC_BACKEND_URL: http://localhost:5001/api
        run: npm run test:ci || npm test -- --ci --coverage --maxWorkers=2

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL || 'http://localhost:5001/api' }}
        run: npm run build

      - name: Build status
        run: echo "✅ Frontend build check passed"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
