name: Frontend CI/CD Pipeline

on:
  push:
    branches: 
      - main
      - master
      - develop
      - calneder
      - calender
      - merge
      - merge_new
      - new
      - production
      - roles
      - working
  pull_request:
    branches: 
      - main
      - master
      - develop
      - calneder
      - calender
      - merge
      - merge_new
      - new
      - production
      - roles
      - working
  workflow_dispatch: # Allows manual triggering from Actions tab

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          # Use npm install (not npm ci) to ensure optional dependencies are installed
          # npm ci skips optional dependencies, but Tailwind CSS v4 requires lightningcss platform binaries
          # First, install main dependencies (this should install optional dependencies automatically)
          npm install --no-audit
          # Get the lightningcss version to match the optional dependency version
          LIGHTNINGCSS_VERSION=$(node -p "require('./node_modules/lightningcss/package.json').version" 2>/dev/null || echo "1.30.1")
          echo "Detected lightningcss version: $LIGHTNINGCSS_VERSION"
          # Explicitly install lightningcss optional dependency for Linux x64 GNU (ubuntu-latest runner)
          # This is a safety net in case npm skipped optional dependencies
          echo "Installing lightningcss platform binary (lightningcss-linux-x64-gnu@$LIGHTNINGCSS_VERSION)..."
          npm install "lightningcss-linux-x64-gnu@$LIGHTNINGCSS_VERSION" --legacy-peer-deps --no-audit 2>&1 || echo "⚠️ Note: Installation attempt completed (may already be installed)"
          # Verify the package is available (this will fail the build if not found, which is what we want)
          echo "Verifying lightningcss native binary..."
          node -e "try { const pkg = require('lightningcss-linux-x64-gnu'); console.log('✅ lightningcss native binary found and loaded successfully'); } catch(e) { console.error('❌ ERROR: lightningcss native binary not found!'); console.error('Error details:', e.message); console.error('The build will fail. Trying to diagnose...'); console.error('Checking node_modules/lightningcss-linux-x64-gnu...'); const fs = require('fs'); try { const files = fs.readdirSync('node_modules'); console.log('Available packages:', files.filter(f => f.includes('lightningcss')).join(', ')); } catch(e2) { console.error('Could not list node_modules'); } process.exit(1); }"

      - name: Run linter
        env:
          CI: true
        run: |
          # Try to run linter, but skip if ESLint requires interactive configuration
          echo "Running ESLint..."
          npm run lint 2>&1 | tee lint-output.txt || true
          if grep -q "How would you like to configure ESLint" lint-output.txt; then
            echo "⚠️ ESLint requires interactive setup. Skipping linting in CI."
            echo "Note: Configure ESLint locally by running 'npm run lint' and following the prompts."
          else
            echo "✅ Linting completed"
          fi
        continue-on-error: true # Don't fail build if linting fails

      - name: Run tests
        env:
          NODE_ENV: test
          NEXT_PUBLIC_BACKEND_URL: http://localhost:5001/api
        run: npm run test:ci || npm test -- --ci --coverage --maxWorkers=2

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          # Use npm install (not npm ci) to ensure optional dependencies are installed
          # npm ci skips optional dependencies, but Tailwind CSS v4 requires lightningcss platform binaries
          # First, install main dependencies (this should install optional dependencies automatically)
          npm install --no-audit
          # Get the lightningcss version to match the optional dependency version
          LIGHTNINGCSS_VERSION=$(node -p "require('./node_modules/lightningcss/package.json').version" 2>/dev/null || echo "1.30.1")
          echo "Detected lightningcss version: $LIGHTNINGCSS_VERSION"
          # Explicitly install lightningcss optional dependency for Linux x64 GNU (ubuntu-latest runner)
          # This is a safety net in case npm skipped optional dependencies
          echo "Installing lightningcss platform binary (lightningcss-linux-x64-gnu@$LIGHTNINGCSS_VERSION)..."
          npm install "lightningcss-linux-x64-gnu@$LIGHTNINGCSS_VERSION" --legacy-peer-deps --no-audit 2>&1 || echo "⚠️ Note: Installation attempt completed (may already be installed)"
          # Verify the package is available (this will fail the build if not found, which is what we want)
          echo "Verifying lightningcss native binary..."
          node -e "try { const pkg = require('lightningcss-linux-x64-gnu'); console.log('✅ lightningcss native binary found and loaded successfully'); } catch(e) { console.error('❌ ERROR: lightningcss native binary not found!'); console.error('Error details:', e.message); console.error('The build will fail. Trying to diagnose...'); console.error('Checking node_modules/lightningcss-linux-x64-gnu...'); const fs = require('fs'); try { const files = fs.readdirSync('node_modules'); console.log('Available packages:', files.filter(f => f.includes('lightningcss')).join(', ')); } catch(e2) { console.error('Could not list node_modules'); } process.exit(1); }"

      - name: Build Next.js app
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL || 'http://localhost:5001/api' }}
        run: npm run build

      - name: Build status
        run: echo "✅ Frontend build check passed"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --no-audit

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
